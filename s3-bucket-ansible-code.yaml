---
- name: Provision S3 Bucket with Versioning
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bucket_name: "project-bucket-hoja"   # Must be globally unique across AWS
    aws_region: "us-east-2"                     # Target region

  tasks:
    - name: Create S3 
      amazon.aws.s3_bucket:
        name: "{{ bucket_name }}"
        region: "{{ aws_region }}"
        state: present
        versioning: true                         # Enables S3 versioning controls
      register: s3_bucket_result

    - name: Print the bucket creation details
      ansible.builtin.debug:
        var: s3_bucket_result
