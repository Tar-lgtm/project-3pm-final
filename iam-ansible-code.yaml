---
- name: Create AWS IAM Role
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    role_name: "AnsibleAutomationRole"

  tasks:
    - name: Provision IAM Role with trust policy
      amazon.aws.iam_role:
        name: "{{ role_name }}"
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: "Allow"
              Principal:
                Service: "ec2.amazonaws.com"
              Action: "sts:AssumeRole"
        managed_policies:
          - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        state: present
      register: iam_role_info

    - name: Output the creation results
      ansible.builtin.debug:
        var: iam_role_info



